name: ci

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: apps/backend/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Frontend install, format, lint, typecheck, test, build
        run: |
          bun install --frozen-lockfile
          bun run fmt:check
          bun run lint
          bun run check
          bun run test
          bun run web:build
      # Unit/contract tests include root-only filesystem ownership tests.
      - name: Go format, vet, race tests, generated-type drift, build
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOCACHE,GOMODCACHE make -C apps/backend ci
      - name: Known vulnerabilities (govulncheck)
        run: make -C apps/backend vuln
      - name: Real Docker integration tests
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOCACHE,GOMODCACHE make -C apps/backend test-integration
