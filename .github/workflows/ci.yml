name: release-binaries

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.0"

jobs:
  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run quality and test gates
        run: |
          bun run fmt:check
          bun run lint
          bun run check
          bun run test
          bun run test:integration

      - name: Compile amd64 and arm64 binaries
        run: |
          bun run compile:amd64
          bun run compile:arm64

      - name: Upload release binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          files: |
            dist/bento-linux-amd64
            dist/bento-linux-arm64
          fail_on_unmatched_files: true
