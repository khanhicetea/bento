name: ci

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Frontend install, format, lint, typecheck, build
        run: |
          bun install --frozen-lockfile
          bun run fmt:check
          bun run lint
          bun run check
          bun run web:build
      # Unit/contract tests include root-only filesystem ownership tests.
      - name: Go format, vet, race tests, generated-type drift, build
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOCACHE,GOMODCACHE make -C apps/backend ci
      - name: Real Docker integration tests
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOCACHE,GOMODCACHE make -C apps/backend test-integration
