services:
  bento:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${BENTO_IMAGE:-bento:local}
    restart: unless-stopped
    environment:
      BENTO_STACK_ROOT: ${BENTO_STACK_ROOT:?set BENTO_STACK_ROOT to an absolute host path}
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${BENTO_WEB_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      # Keep the absolute path identical in this container and on the Docker host.
      - type: bind
        source: ${BENTO_STACK_ROOT:?set BENTO_STACK_ROOT to an absolute host path}
        target: ${BENTO_STACK_ROOT:?set BENTO_STACK_ROOT to an absolute host path}
        bind:
          create_host_path: false
