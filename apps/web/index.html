<!doctype html>
<html lang="en" data-theme="bento">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#173d32" />
    <title>Bento Control Plane</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="Bento overview"
          ><span class="brand-mark">B</span
          ><span><strong>Bento</strong><small>Control plane</small></span></a
        >
        <nav id="nav" aria-label="Main navigation"></nav>
        <div class="sidebar-foot">
          <span id="connection" class="status status-warning"></span
          ><span id="connection-label">Connecting</span>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <button id="menu-button" class="btn btn-ghost btn-sm" aria-label="Toggle navigation">
              ☰
            </button>
            <p class="eyebrow">SINGLE-HOST OPERATIONS</p>
            <h1 id="page-title">Overview</h1>
          </div>
          <div class="top-actions">
            <span id="stack-name" class="badge badge-outline">Loading…</span
            ><button id="theme" class="btn btn-ghost btn-sm" aria-label="Toggle theme">◐</button
            ><button id="refresh" class="btn btn-primary btn-sm">Refresh</button>
          </div>
        </header>
        <div id="notice" role="status" aria-live="polite"></div>
        <section id="content" class="content" aria-live="polite">
          <div class="loading loading-spinner loading-lg"></div>
        </section>
      </main>
    </div>

    <dialog id="app-editor" class="modal">
      <div class="modal-box app-editor-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost modal-close" aria-label="Close">✕</button>
        </form>
        <p class="eyebrow">APPLICATION</p>
        <h2 id="app-editor-title" class="text-xl font-bold">Create application</h2>
        <p id="app-editor-help" class="form-help">
          Set the public domain and runtime. Bento validates and applies the change.
        </p>
        <form id="app-form">
          <input id="app-form-mode" type="hidden" value="create" />
          <div class="form-grid">
            <label class="form-control"
              ><span class="label-text">App slug</span
              ><input
                id="app-slug"
                class="input input-bordered"
                required
                pattern="[a-z0-9][a-z0-9-]*"
                placeholder="my-app"
                autocomplete="off"
            /></label>
            <label class="form-control"
              ><span class="label-text">Primary domain</span
              ><input
                id="app-domain"
                class="input input-bordered"
                required
                placeholder="app.example.com"
                inputmode="url"
                autocomplete="off"
            /></label>
            <label class="form-control form-span"
              ><span class="label-text"
                >Domain aliases <small>optional, comma separated</small></span
              ><input
                id="app-aliases"
                class="input input-bordered"
                placeholder="www.example.com, api.example.com"
                autocomplete="off"
            /></label>
            <label class="form-control"
              ><span class="label-text">PHP version</span
              ><select id="app-php" class="select select-bordered">
                <option value="">Stack default</option>
              </select></label
            >
            <label class="form-control"
              ><span class="label-text">FPM capacity</span
              ><select id="app-fpm" class="select select-bordered">
                <option value="">Stack default</option>
                <option>tiny</option>
                <option>small</option>
                <option>medium</option>
                <option>large</option>
                <option>xlarge</option>
                <option>ondemand</option>
              </select></label
            >
            <label class="form-control"
              ><span class="label-text">Document root</span
              ><input
                id="app-docroot"
                class="input input-bordered"
                placeholder="public"
                autocomplete="off"
            /></label>
            <label class="form-control"
              ><span class="label-text">Routing</span
              ><select id="app-routing" class="select select-bordered">
                <option value="">Automatic</option>
                <option value="front">Front controller</option>
                <option value="legacy">Direct PHP files</option>
              </select></label
            >
          </div>
          <fieldset id="database-fields" class="form-section">
            <label class="check-row"
              ><input id="app-db" type="checkbox" class="checkbox checkbox-primary" /><span
                ><strong>Create a database</strong
                ><small>Provision an initial database with this app</small></span
              ></label
            >
            <div id="database-options" class="form-grid conditional-fields" hidden>
              <label class="form-control"
                ><span class="label-text">Engine</span
                ><select id="app-db-engine" class="select select-bordered">
                  <option value="mysql">MySQL</option>
                  <option value="postgres">PostgreSQL</option>
                  <option value="sqlite">SQLite</option>
                  <option value="litestream">Litestream</option>
                </select></label
              >
              <label class="form-control"
                ><span class="label-text">Database name</span
                ><input
                  id="app-db-name"
                  class="input input-bordered"
                  placeholder="Same as app slug"
                  autocomplete="off"
              /></label>
            </div>
          </fieldset>
          <label class="check-row"
            ><input id="app-access-log" type="checkbox" class="checkbox checkbox-primary" /><span
              ><strong>Access logs</strong
              ><small>Keep a separate request log for this app</small></span
            ></label
          >
          <div class="modal-action">
            <button type="button" class="btn" id="cancel-app-form">Cancel</button
            ><button id="save-app" type="submit" class="btn btn-primary">Create application</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="app-details" class="modal">
      <div class="modal-box app-details-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost modal-close" aria-label="Close">✕</button>
        </form>
        <div id="app-details-content"></div>
      </div>
    </dialog>

    <dialog id="runner" class="modal">
      <div class="modal-box runner-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost modal-close" aria-label="Close">✕</button>
        </form>
        <p class="eyebrow">BENTO COMMAND</p>
        <h2 id="runner-title" class="text-xl font-bold">Run operation</h2>
        <label class="form-control"
          ><span class="label-text">Arguments (quotes are supported; no shell expansion)</span
          ><textarea
            id="command"
            class="textarea textarea-bordered code"
            rows="4"
            spellcheck="false"
          ></textarea>
        </label>
        <div class="modal-action">
          <button id="run-command" class="btn btn-primary">Run</button>
        </div>
      </div>
    </dialog>

    <dialog id="output-modal" class="modal">
      <div class="modal-box output-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost modal-close" aria-label="Close">✕</button>
        </form>
        <div class="output-head">
          <div>
            <p class="eyebrow">OPERATION RESULT</p>
            <h2 id="output-title" class="text-xl font-bold">Command output</h2>
          </div>
          <span id="exit-code" class="badge"></span>
        </div>
        <pre id="output" tabindex="0"></pre>
        <div class="modal-action">
          <button id="copy-output" class="btn btn-ghost">Copy</button>
          <form method="dialog"><button class="btn">Close</button></form>
        </div>
      </div>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
