# Bento app-local Valkey. It listens on loopback inside this app's container
# only, so it needs no password. The s6 run script passes --dir, the app's
# ~/.local/share/valkey, where the RDB snapshot is kept.
bind 127.0.0.1 -::1
port 6379
protected-mode yes
daemonize no
logfile ""
save 3600 1 300 100 60 10000
dbfilename dump.rdb
# The snapshot is best effort: a failed one (a full home, a fork refused under
# memory pressure) is logged and retried, and writes keep working. Valkey's
# default would refuse every write (MISCONF) until a later snapshot succeeds,
# taking the app's cache, sessions and queues down with it.
stop-writes-on-bgsave-error no
appendonly no
# maxmemory comes from the run script (a quarter of the app's memory limit).
# At the cap, evict the least recently used keys that have a TTL (cache
# entries, sessions); keys without one (queues, locks, data the app keeps on
# purpose) are never evicted, and writes fail instead once only those remain.
maxmemory-policy volatile-lru
