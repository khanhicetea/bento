memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = UTC
expose_php = Off
cgi.fix_path_info = 0
upload_tmp_dir = /tmp
; PHP2Shell (CVE-2026-109618/109619) hardening, defense in depth beside the
; patched PHP. Ignored by PHP before 8.5, which has no fatal_error_backtraces.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
; Production defaults (no php.ini is installed, so PHP's built-in development
; values applied). Errors go to the log (the app's log stream for FPM, stderr
; for the CLI), never into a page.
display_errors = Off
display_startup_errors = Off
log_errors = On
; assert() is compiled out. Only php.ini or -d can turn it back on, for
; example `php -d zend.assertions=1 vendor/bin/phpunit`.
zend.assertions = -1
; $argv stays CLI-only (the CLI always registers it). In a web request it holds
; the query string, which turns a file-include bug that reaches pearcmd.php or
; a similar script into code execution.
register_argc_argv = Off
