memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = UTC
expose_php = Off
cgi.fix_path_info = 0
upload_tmp_dir = /tmp
; PHP2Shell (CVE-2026-109618/109619) hardening, defense in depth beside the
; patched PHP. Ignored by PHP before 8.5, which has no fatal_error_backtraces.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
