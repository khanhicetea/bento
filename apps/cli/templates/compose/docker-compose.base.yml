# Reference base topology (generated from state at render time)
x-log-common: &log-common
  driver: local
  options:
    max-size: 10m
    max-file: "3"
name: "${COMPOSE_PROJECT_NAME:-bento}"
networks:
  private:
    driver: bridge
    name: "${COMPOSE_PROJECT_NAME:-bento}_private"
  backup-egress:
    driver: bridge
    name: "${COMPOSE_PROJECT_NAME:-bento}_backup_egress"
services:
  nginx:
    image: bento/nginx:latest
    # Runtime generation selects host mode (default) or the stack-private network
    # from NGINX_HOST_NETWORK. This reference shows the default.
    network_mode: host
    restart: unless-stopped
    logging: *log-common
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *log-common
    networks: [private]
    volumes:
      - redis-data:/data
  # Profile-only sidecar; invoked through `bento rclone -- ...`.
  rclone:
    image: rclone/rclone:1.68.2
    profiles: [rclone]
    entrypoint: [rclone]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *log-common
    networks: [backup-egress]
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    tmpfs: [/tmp]
    volumes:
      - ./rclone:/config/rclone
      - ./backups:/backups:ro
volumes:
  redis-data: null
