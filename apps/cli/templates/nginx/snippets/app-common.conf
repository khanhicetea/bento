# Shared defaults for generated PHP application servers.
charset utf-8;
index index.php index.html;

location = /favicon.ico {
  access_log off;
  log_not_found off;
}

location = /robots.txt {
  access_log off;
  log_not_found off;
}

# Never expose dotfiles; keep ACME's conventional path available.
location ~ /\.(?!well-known(?:/|$)) {
  deny all;
  access_log off;
  log_not_found off;
}

# Serve common assets directly without invoking PHP.
location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2|ttf|eot|webmanifest)$ {
  expires 30d;
  access_log off;
  log_not_found off;
  try_files $uri =404;
}
