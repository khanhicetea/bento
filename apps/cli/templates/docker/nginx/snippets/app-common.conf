# Build-time fallback; runtime replaces this file with the generated equivalent.
charset utf-8;
index index.php index.html;

location = /favicon.ico {
  access_log off;
  log_not_found off;
}

location = /robots.txt {
  access_log off;
  log_not_found off;
}

location ~ /\.(?!well-known(?:/|$)) {
  deny all;
  access_log off;
  log_not_found off;
}

location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2|ttf|eot|webmanifest)$ {
  expires 30d;
  access_log off;
  log_not_found off;
  try_files $uri =404;
}
